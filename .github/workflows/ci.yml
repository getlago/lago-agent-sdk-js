name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · node${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Build before typecheck: the gateway workspace's types resolve against
      # packages/agent-sdk/dist, which only exists after a build.
      - name: Build
        run: npm run build

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  gateway:
    name: gateway · node24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck gateway
        run: npm run -w @getlago/ai-gateway typecheck

      - name: Gateway tests (incl. kill -9 crash recovery)
        run: npm run -w @getlago/ai-gateway test

  verify-gateway:
    name: verify:gateway (full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: verify:gateway (build + tests + compose + integration + load smoke)
        run: npm run verify:gateway
